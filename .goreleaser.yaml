version: 2

project_name: thinroute

before:
  hooks:
    - go mod tidy

builds:
  - id: thinroute
    binary: thinroute
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/thinroute
    ldflags:
      - -s -w
      - -X github.com/0xfig-labs/thinroute/internal/version.Version={{.Version}}
      - -X github.com/0xfig-labs/thinroute/internal/version.Commit={{.Commit}}
      - -X github.com/0xfig-labs/thinroute/internal/version.Date={{.Date}}
archives:
  - ids: [thinroute]
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: "checksums.txt"
brews:
  - name: thinroute
    repository:
      owner: 0xfig-labs
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/0xfig-labs/thinroute"
    description: "A local-first, OpenAI-compatible LLM gateway"
    license: "MIT"


release:
  replace_existing_draft: true

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  groups:
    - title: "Breaking Changes"
      regexp: '^[a-z]+(\([^)]+\))?!:'
      order: 0
    - title: "Features"
      regexp: '^feat(\([^)]+\))?:'
      order: 1
    - title: "Bug Fixes"
      regexp: '^fix(\([^)]+\))?:'
      order: 2
    - title: "Performance"
      regexp: '^perf(\([^)]+\))?:'
      order: 3
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - '^docs(\([^)]+\))?!?:'
      - '^test(\([^)]+\))?!?:'
      - '^ci(\([^)]+\))?!?:'
      - '^build(\([^)]+\))?!?:'
      - '^chore(\([^)]+\))?!?:'
      - '^refactor(\([^)]+\))?!?:'
      - 'Merge pull request'
      - 'Merge branch'
