name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - run: go build ./cmd/thinroute
      - run: go test ./... -count=1 -timeout 5m
      - run: go test -tags=e2e ./tests/e2e/... -count=1 -timeout 5m
      - run: go test -tags=contract ./tests/contract/... -count=1 -timeout 5m
      - run: go test -run '^TestHotPathPerfGuard$' -count=1 ./tests/perf/...
